name: CI

on:
  # All branches, not just main: pushing a branch is itself the first proof
  # this workflow runs at all on GitHub infrastructure — it has never
  # executed there before. Narrow this back to branches: [main] only once
  # that is no longer in doubt.
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # compileSdk is 37 (see app/build.gradle.kts and the note in
      # subspace.android.library). ubuntu-latest (Ubuntu 24.04, verified
      # 2026-07-25) already ships platforms;android-37 and
      # build-tools;37.0.0, but this step installs them explicitly so CI
      # does not silently depend on whatever the runner image happens to
      # ship in a given month. It is a fast no-op when the packages are
      # already present.
      - name: Install Android SDK platform 37
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify module boundaries, format, static analysis, licence headers
        run: ./gradlew checkAll

      # `build` (assemble + check), not `assembleDebug`: the release variant
      # is where R8/minification runs, and assembleDebug never exercises
      # that path. A missing proguard-rules.pro sat green through seven
      # task reviews for exactly this reason — every prior verification
      # used checkAll or assembleDebug, never `build`.
      - name: Build (assemble + check, including the release/R8 path)
        run: ./gradlew build

      - name: Unit tests
        run: ./gradlew test
